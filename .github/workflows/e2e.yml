name: E2E

# The expensive suite: the full test run on Linux, Windows and macOS and the
# e2e installs. Every job runs on a GitHub-hosted image (docs/runners.md) and
# prints which runner executed it, so release evidence can name it.
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'templates/**'
      - '.github/workflows/e2e.yml'
      - 'test/e2e/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      release_acceptance:
        description: 'Run real pinned Spec Kit acceptance from the packed candidate (network and disposable machine cache)'
        type: boolean
        default: false
      release_sha:
        description: 'Full candidate commit SHA; required for release acceptance'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Record the runner
        shell: bash
        env:
          RUNNER_NAME_: ${{ runner.name }}
          RUNNER_OS_: ${{ runner.os }}
          RUNNER_ENVIRONMENT_: ${{ runner.environment }}
          RUNNER_ARCH_: ${{ runner.arch }}
          SHA_: ${{ github.sha }}
        run: |
          echo "runner.name=$RUNNER_NAME_ runner.os=$RUNNER_OS_ runner.environment=$RUNNER_ENVIRONMENT_ runner.arch=$RUNNER_ARCH_ ImageOS=${ImageOS:-} sha=$SHA_"
      - name: Validate release candidate SHA
        if: github.event_name == 'workflow_dispatch' && inputs.release_acceptance
        shell: bash
        env:
          RIG_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RIG_RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'release-acceptance: invalid candidate SHA' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_acceptance && inputs.release_sha || github.sha }}
          fetch-depth: 0 # the released-hash ledger test reads commits of past releases
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Provision pinned uv for release acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.release_acceptance
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.17'
          enable-cache: false
      - name: Accept the exact packed release candidate
        if: github.event_name == 'workflow_dispatch' && inputs.release_acceptance
        shell: bash
        env:
          RIG_RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_ACCEPTANCE: '1'
        run: node scripts/release-acceptance.mjs --sha "$RIG_RELEASE_SHA"

  # The whole suite on Windows — unit, template and e2e, no file
  # excluded by name (AR-93). Not on
  # pull requests: the PR path checks the unit project in ci.yml's
  # windows-smoke job; this job is the Windows evidence for master, the
  # nightly and a release dispatch on an exact SHA.
  windows-e2e:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Record the runner
        shell: bash
        env:
          RUNNER_NAME_: ${{ runner.name }}
          RUNNER_OS_: ${{ runner.os }}
          RUNNER_ENVIRONMENT_: ${{ runner.environment }}
          RUNNER_ARCH_: ${{ runner.arch }}
          SHA_: ${{ github.sha }}
        run: |
          echo "runner.name=$RUNNER_NAME_ runner.os=$RUNNER_OS_ runner.environment=$RUNNER_ENVIRONMENT_ runner.arch=$RUNNER_ARCH_ ImageOS=${ImageOS:-} sha=$SHA_"
      - name: Validate release candidate SHA
        if: github.event_name == 'workflow_dispatch' && inputs.release_acceptance
        shell: bash
        env:
          RIG_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RIG_RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'release-acceptance: invalid candidate SHA' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_acceptance && inputs.release_sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --maxWorkers=2
      - name: Provision pinned uv for release acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.release_acceptance
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.17'
          enable-cache: false
      - name: Accept the exact packed release candidate
        if: github.event_name == 'workflow_dispatch' && inputs.release_acceptance
        shell: bash
        env:
          RIG_RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_ACCEPTANCE: '1'
        run: node scripts/release-acceptance.mjs --sha "$RIG_RELEASE_SHA"

  # Off pull requests like windows-e2e: this job is the macOS (Apple silicon)
  # evidence for master, the nightly and a release dispatch on an exact SHA.
  macos-e2e:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Record the runner
        shell: bash
        env:
          RUNNER_NAME_: ${{ runner.name }}
          RUNNER_OS_: ${{ runner.os }}
          RUNNER_ENVIRONMENT_: ${{ runner.environment }}
          RUNNER_ARCH_: ${{ runner.arch }}
          SHA_: ${{ github.sha }}
        run: |
          echo "runner.name=$RUNNER_NAME_ runner.os=$RUNNER_OS_ runner.environment=$RUNNER_ENVIRONMENT_ runner.arch=$RUNNER_ARCH_ ImageOS=${ImageOS:-} sha=$SHA_"
      - name: Validate release candidate SHA
        if: github.event_name == 'workflow_dispatch' && inputs.release_acceptance
        shell: bash
        env:
          RIG_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RIG_RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'release-acceptance: invalid candidate SHA' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_acceptance && inputs.release_sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Provision pinned uv for release acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.release_acceptance
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.17'
          enable-cache: false
      - name: Accept the exact packed release candidate
        if: github.event_name == 'workflow_dispatch' && inputs.release_acceptance
        shell: bash
        env:
          RIG_RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_ACCEPTANCE: '1'
        run: node scripts/release-acceptance.mjs --sha "$RIG_RELEASE_SHA"
