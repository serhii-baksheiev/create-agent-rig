name: E2E

# The expensive suite: the full test run on Linux and Windows, the e2e installs
# and the benchmark. Hosted-first by ruling (docs/runners.md): both jobs run on
# GitHub-hosted images unless the dispatch input `runner_mode` or the
# repository variable `RUNNER_MODE` says `self-hosted` — the same jobs and the
# same commands either way, only `runs-on` differs, and every job prints which
# runner executed it so release evidence can name the runner type.
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'templates/**'
      - '.github/workflows/e2e.yml'
      - 'test/e2e/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      runner_mode:
        description: 'hosted (GitHub-hosted images) or self-hosted (the registered fallback runners)'
        type: choice
        default: hosted
        options:
          - hosted
          - self-hosted

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ${{ (inputs.runner_mode == 'self-hosted' || vars.RUNNER_MODE == 'self-hosted') && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-latest' }}
    steps:
      - name: Record the runner
        shell: bash
        run: |
          echo "runner.name=${{ runner.name }} runner.os=${{ runner.os }} runner.environment=${{ runner.environment }} runner.arch=${{ runner.arch }} ImageOS=${ImageOS:-} sha=${{ github.sha }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the released-hash ledger test reads commits of past releases
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The whole suite on Windows — unit, template, benchmark and e2e, no file
  # excluded by name (AR-93) — plus the cold template artifact check. Not on
  # pull requests: the PR path checks the unit project in ci.yml's
  # windows-smoke job; this job is the Windows evidence for master, the
  # nightly and a release dispatch on an exact SHA.
  windows-e2e:
    if: github.event_name != 'pull_request'
    runs-on: ${{ (inputs.runner_mode == 'self-hosted' || vars.RUNNER_MODE == 'self-hosted') && fromJSON('["self-hosted", "Windows", "X64"]') || 'windows-latest' }}
    timeout-minutes: 45
    steps:
      - name: Record the runner
        shell: bash
        run: |
          echo "runner.name=${{ runner.name }} runner.os=${{ runner.os }} runner.environment=${{ runner.environment }} runner.arch=${{ runner.arch }} ImageOS=${ImageOS:-} sha=${{ github.sha }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --maxWorkers=2
      - run: pnpm --dir templates/skeleton/node-service install --frozen-lockfile
      - name: Require a cold template artifact
        shell: pwsh
        run: |
          if (Test-Path templates/skeleton/node-service/dist) {
            throw 'Cold template validation requires an absent dist directory'
          }
      - run: pnpm --dir templates/skeleton/node-service test
